# /etc/nas-management.conf
# Shared configuration for NAS monitoring and backup scripts

NAS_USER="YOURUSERNAME"
ALERT_FILE="/home/$NAS_USER/.disk-alerts"
BACKUP_STATUS_FILE="/home/$NAS_USER/.backup-status"

# Backup drive — reference by stable /dev/disk/by-id paths, NOT /dev/sdX, since
# kernel device letters can reorder across reboots. Find yours with:
#   udevadm info -q symlink -n /dev/sdX | tr ' ' '\n' | grep by-id
# Use the whole-disk symlink for BACKUP_DEVICE and its "-part1" for the partition.
BACKUP_DEVICE="/dev/disk/by-id/usb-REPLACE_ME-0:0"
BACKUP_PARTITION="/dev/disk/by-id/usb-REPLACE_ME-0:0-part1"
MAPPER_NAME="backups"
MOUNT_POINT="/mnt/backups"
KEYFILE="/etc/backup-luks.key"

MONITORED_MOUNTS="/mnt/bucket-md0 /mnt/bucket-md1"

# Data drives = the RAID member disks, resolved at runtime from /proc/mdstat so a
# change in kernel device-letter ordering can't desync this from the real array.
# Falls back to the sd[a-d] glob if mdstat is unreadable (e.g. no software RAID).
DISK_DEVICES=$(awk '/^md[0-9]/{for(i=1;i<=NF;i++) if($i ~ /^sd[a-z]+[0-9]*\[/){d=$i; sub(/\[.*/,"",d); sub(/[0-9]+$/,"",d); print "/dev/"d}}' /proc/mdstat 2>/dev/null | sort -u | tr '\n' ' ')
[ -n "$DISK_DEVICES" ] || DISK_DEVICES="/dev/sd[a-d]"

SPACE_WARN_PCT=90
TEMP_WARN_C=50
BACKUP_STALE_DAYS=3

DRIVE_USAGE_LOG="/home/$NAS_USER/.drive-usage.log"
DRIVE_USAGE_STATE="/home/$NAS_USER/.drive-usage-state"
